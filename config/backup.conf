# Backup configuration - sourced by the scripts
SOURCE_DIRS=("/home/adminuser/important-data")
BACKUP_DIR="/home/adminuser/backups"
LOG_FILE="/home/adminuser/backup.log"
RETENTION_DAYS=7
MIN_FREE_MB=500
# Leave S3_BUCKET empty to disable cloud upload
S3_BUCKET=""
S3_PREFIX="backups/"
# Optional: GPG recipient for encrypting archives (empty = no encryption)
GPG_RECIPIENT=""
